<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgroGestor+</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            color: #222;
            overflow-x: hidden;
        }

        .pagina {

            width: 100%;
            max-width: 360px;
            min-height: 800px;
            margin: 0 auto;
            background: #ffffff;
            position: relative;
            overflow: hidden;

            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.12);
        }

        .topo {

            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 18px;
        }

        .folha-esquerda {

            position: absolute;
            top: -100px;
            left: -105px;
            width: 215px;
            height: 250px;
            background: #eef4e9;
            border-radius: 0 0 100% 0;
            z-index: 0;
        }

        .folhas-superior {

            position: absolute;
            top: 35px;
            right: -18px;
            width: 78px;
            height: 105px;
            object-fit: contain;
            z-index: 1;
        }

        .logo-area {

            position: relative;
            z-index: 2;
            width: 220px;
            height: 225px;
            margin-top: 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {

            width: 220px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .boas-vindas {

            width: 100%;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .boas-vindas .titulo {

            font-size: 25px;
            font-weight: 400;
            color: #292929;
            line-height: 1.1;
        }

        .boas-vindas .nome {

            display: block;
            margin-top: 3px;
            font-size: 30px;
            font-weight: 800;
            color: #398b2d;
            line-height: 1.05;
        }

        .boas-vindas .subtitulo {

            margin-top: 8px;
            font-size: 15px;
            color: #6c6c6c;
            font-weight: 400;
        }

        .botoes {

            width: 100%;
            padding: 0 20px;
            margin-top: 25px;

            display: flex;
            flex-direction: column;
            gap: 12px;

            position: relative;
            z-index: 3;
        }

        .botao {

            width: 100%;
            height: 55px;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 19px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .botao-entrar {

            border: none;
            background: #398b2d;
            color: white;

            box-shadow:
                0 4px 10px rgba(50, 120, 40, 0.18);
        }

        .botao-entrar:hover {

            background: #286f20;
        }

        .botao-entrar:active {

            transform: scale(0.98);
        }

        .botao-criar {

            background: white;
            border: 2px solid #398b2d;
            color: #398b2d;
        }

        .botao-criar:hover {

            background: #f1f8ee;
        }

        .botao-criar:active {

            transform: scale(0.98);
        }

        .icone-botao {

            width: 31px;
            height: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icone-botao img {

            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .beneficios {

            width: 100%;
            margin-top: 30px;
            padding: 0 3px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            position: relative;
            z-index: 2;
        }

        .beneficio {

            min-width: 0;
            padding: 0 5px;
            text-align: center;
            position: relative;
        }

        .beneficio:not(:last-child)::after {

            content: "";

            position: absolute;
            right: 0;
            top: 3px;

            width: 1px;
            height: 82px;

            background: #e5e5e5;
        }

        .icone-circulo {

            width: 55px;
            height: 55px;

            margin: 0 auto 8px;

            border-radius: 50%;

            background: #edf6e9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .icone-circulo img {

            width: 55px;
            height: 55px;

            object-fit: contain;
        }

        .beneficio h3 {

            color: #333;
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.2;
        }

        .beneficio p {

            margin-top: 5px;
            color: #737373;
            font-size: 9.5px;
            line-height: 1.3;
        }

        .fazenda-area {

            width: 100%;
            height: 185px;
            margin-top: 20px;

            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .imagem-fazenda {

            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center bottom;
        }

        .curva {

            position: absolute;

            top: -32px;
            left: -5%;

            width: 110%;
            height: 65px;

            background: white;
            border-radius: 50%;

            z-index: 2;
        }

        .rodape {

            width: 100%;
            height: 55px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 8px;
        }

        .versao {

            display: flex;
            align-items: center;
            gap: 7px;

            color: #588a4e;
            font-size: 12px;
            font-weight: 600;
        }

        .folhinha {

            width: 15px;
            height: 8px;

            background: #398b2d;

            border-radius: 100% 0 100% 0;

            transform: rotate(-25deg);
        }

        @media (max-width: 320px) {

            .pagina {
                min-height: 100vh;
            }

            .logo-area {

                width: 200px;
                height: 205px;
                margin-top: 20px;
            }

            .logo {
                width: 200px;
            }

            .boas-vindas .titulo {
                font-size: 23px;
            }

            .boas-vindas .nome {
                font-size: 28px;
            }

            .boas-vindas .subtitulo {
                font-size: 14px;
            }

            .botoes {
                padding: 0 17px;
            }

            .botao {

                height: 52px;
                font-size: 18px;
            }

            .icone-circulo {

                width: 20px;
                height: 20px;
            }

            .beneficio h3 {
                font-size: 10px;
            }

            .beneficio p {
                font-size: 8.5px;
            }

            .fazenda-area {
                height: 170px;
            }
        }

        @media (min-width: 361px) {

            body {
                background: #eeeeee;
            }

            .pagina {

                box-shadow:
                    0 0 30px rgba(0, 0, 0, 0.15);
            }
        }

    </style>

</head>


<body>

    <div class="pagina">

        <main class="topo">

            <div class="folha-esquerda"></div>

            <img
                src="/Página inicial 2/folhas.png"
                alt=""
                class="folhas-superior"
            >

            <div class="logo-area">

                <img
                    src="AgroGestor.png"
                    alt="Logo AgroGestor+"
                    class="logo"
                >

            </div>

            <section class="boas-vindas">

                <div class="titulo">
                    Bem-vindo ao
                </div>

                <div class="nome">
                    AgroGestor+
                </div>

                <div class="subtitulo">
                    Sua fazenda na palma da mão.
                </div>

            </section>


            <section class="botoes">

                <!-- BOTÃO ENTRAR -->

<a
    href="../Página Entrar/entrar.html"
    class="botao botao-entrar"
>
    <span class="icone-botao">
        <img
            src="icone-entrar.png"
            alt=""
        >
    </span>

    <span>
        Entrar
    </span>
</a>


<!-- BOTÃO CRIAR CONTA -->

<a
    href="..//PÁGINA CRIAR CONTA/criar.html"
    class="botao botao-criar"
>

    <span class="icone-botao">

        <img
            src="criar-conta.png"
            alt=""
        >

    </span>

    <span>
        Criar Conta
    </span>

</a>

            </section>


            <section class="beneficios">

                <div class="beneficio">

                    <div class="icone-circulo">

                        <img
                            src="gestão.png"
                            alt=""
                        >

                    </div>

                    <h3>
                        Gestão completa
                    </h3>

                    <p>
                        Controle sua fazenda
                        <br>
                        de forma integrada.
                    </p>

                </div>


                <div class="beneficio">

                    <div class="icone-circulo">

                        <img
                            src="produtividade.png"
                            alt=""
                        >

                    </div>

                    <h3>
                        Mais produtividade
                    </h3>

                    <p>
                        Tome decisões melhores
                        <br>
                        com informações reais.
                    </p>

                </div>


                <div class="beneficio">

                    <div class="icone-circulo">

                        <img
                            src="segurança.png"
                            alt=""
                        >

                    </div>

                    <h3>
                        Mais segurança
                    </h3>

                    <p>
                        Seus dados protegidos
                        <br>
                        com tecnologia.
                    </p>

                </div>

            </section>


            <section class="fazenda-area">

                <div class="curva"></div>

                <img
                    src="fazenda.png"
                    alt="Ilustração de uma fazenda"
                    class="imagem-fazenda"
                >

            </section>

        </main>


        <footer class="rodape">

            <div class="versao">

                <span class="folhinha"></span>

                <span>
                    AgroGestor+ v1.0
                </span>

            </div>

        </footer>

    </div>

</body>
</html>
